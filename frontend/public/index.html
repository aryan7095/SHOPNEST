<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Character encoding for the document -->
  <meta charset="utf-8" />
  <!-- Custom favicon for ShopNest -->
  <link rel="icon" href="/ShopNestLogo.png" />
  <!-- Ensures proper scaling/rendering on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Sets the browser toolbar/address bar color on supporting mobile browsers -->
  <meta name="theme-color" content="#000000" />
  <!-- SEO/social preview description -->
  <meta name="description" content="ShopNest | E-commerce Platform" />
  <!-- Browser tab title -->
  <title>ShopNest | E-commerce Platform | Shivansh Vasu</title>
</head>

<body>
  <!-- Fallback message shown if the user has JavaScript disabled -->
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <!-- React app mounts here -->
  <div id="root"></div>
  <!-- Loads Razorpay's checkout script globally so window.Razorpay is available
       for opening the payment widget from anywhere in the app -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</body>

</html>
